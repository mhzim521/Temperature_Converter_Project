<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <header>
        <div class="icon">🌡️</div>
        <div>
          <h1>Temperature Converter</h1>
          <p>Convert Celsius, Fahrenheit & Kelvin instantly</p>
        </div>
      </header>

      <div class="converter">
        <div class="field">
          <label for="value">Temperature</label>
          <div class="input-wrap">
            <input id="value" type="number" step="any" placeholder="Enter temperature">
            <span id="inputUnit">°C</span>
          </div>
        </div>

        <div class="swap-area">
          <div class="field">
            <label for="from">From</label>
            <select id="from">
              <option value="C">Celsius (°C)</option>
              <option value="F">Fahrenheit (°F)</option>
              <option value="K">Kelvin (K)</option>
            </select>
          </div>

          <button class="swap" onclick="swapUnits()" title="Swap units">⇄</button>

          <div class="field">
            <label for="to">To</label>
            <select id="to">
              <option value="F">Fahrenheit (°F)</option>
              <option value="C">Celsius (°C)</option>
              <option value="K">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <button class="convert" onclick="convertTemperature()">Convert Now</button>
        <p class="error" id="error"></p>
      </div>

      <div class="result-card">
        <span>Converted Temperature</span>
        <div>
          <strong id="result">—</strong>
          <small id="resultUnit"></small>
        </div>
      </div>

      <div class="quick">
        <h2>Quick Reference</h2>
        <div class="quick-grid">
          <button onclick="setQuick(0, 'C', 'F')">0°C → °F</button>
          <button onclick="setQuick(100, 'C', 'F')">100°C → °F</button>
          <button onclick="setQuick(32, 'F', 'C')">32°F → °C</button>
          <button onclick="setQuick(273.15, 'K', 'C')">273.15K → °C</button>
        </div>
      </div>

      <button class="reset" onclick="resetConverter()">↻ Reset</button>

      <footer>Simple project • HTML • CSS • JavaScript</footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
